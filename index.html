<!doctype html>
<html lang="fr" data-style="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YUKI-MD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bgimg:url(bg.jpg);--red:#e0213a;--red2:#8e0f20;--gold:#ffc857;--ink:#f6f0f2;--mute:#b9a9ad;--card:rgba(14,8,11,.62);--line:rgba(224,33,58,.38);--ok:#2fe39a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05060a;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:linear-gradient(180deg,rgba(5,6,10,.10),rgba(5,6,10,.72)),var(--bgimg) center top/cover fixed no-repeat;min-height:100vh;padding:0 16px 40px;overflow-x:hidden}
header{position:sticky;top:var(--bar,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 0 12px;margin-bottom:2px}
.menu{width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:4px;padding:0;margin:0;flex:none}
.menu i{width:5px;height:5px;border-radius:50%;background:#fff;display:block}
.title{flex:1;min-width:0}
.title b{display:block;font-size:20px;letter-spacing:.16em}
.title small{display:block;font-size:10px;letter-spacing:.26em;color:var(--mute);margin-top:2px}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);border-radius:99px;padding:8px 12px;font-size:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.pill.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:14px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.eyebrow{color:var(--red);font-size:11px;font-weight:800;letter-spacing:.3em}
h2{margin:6px 0 6px;font-size:24px}
p{margin:0 0 14px;color:var(--mute);line-height:1.5;font-size:14px}
label{display:block;font-size:13px;margin:8px 0 6px}
input,select{width:100%;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:14px;color:var(--ink);font-size:17px;padding:14px 16px;outline:none}
input:focus{border-color:var(--red)}
button.big{width:100%;border:0;border-radius:15px;padding:16px;margin-top:12px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 8px 20px rgba(224,33,58,.3)}
button.big:disabled{opacity:.55}
button.gold{background:linear-gradient(135deg,#ffd777,#e59a1d);color:#2a1700;box-shadow:0 8px 20px rgba(229,154,29,.3)}
button.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;font-weight:500}
.code{margin-top:16px;border:1px dashed var(--line);border-radius:18px;padding:18px;text-align:center}
.code .l{font-size:11px;letter-spacing:.3em;color:var(--mute)}
.code .v{font-size:34px;font-weight:800;letter-spacing:.12em;margin:10px 0}
.code .m{font-size:13px;color:var(--mute)}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);border-right-color:var(--red2,var(--red));margin:16px auto;animation:spin .8s linear infinite;display:none}
.mini{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--red);vertical-align:-2px;margin-right:6px;animation:spin .8s linear infinite}
.emos{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.emo{font-size:24px;line-height:1;padding:9px 11px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer}
.emo.on{border-color:var(--red);box-shadow:0 0 14px var(--red);background:rgba(255,255,255,.1)}
.qk{display:flex;gap:8px;margin:8px 0 0}
.qk button{flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-weight:700}
.how{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:10px;font-size:14px;line-height:1.45}
.how li{padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.wheelbox{position:relative;width:232px;height:232px;margin:16px auto 8px}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid var(--line);overflow:hidden;transition:transform 4.2s cubic-bezier(.17,.67,.2,1);box-shadow:0 0 30px rgba(0,255,255,.25)}
.wheel span{position:absolute;left:50%;top:50%;font-weight:800;font-size:21px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);transform-origin:0 0}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:28px;z-index:2;color:var(--gold)}
.refcode{font-family:Orbitron,monospace;font-size:30px;letter-spacing:.25em;text-align:center;padding:14px;border-radius:16px;border:1px dashed var(--line);margin-top:10px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto;margin:10px 0}
.chat .b{padding:10px 13px;border-radius:16px;max-width:88%;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.chat .u{align-self:flex-end;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.chat .a{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.chatrow{display:flex;gap:8px;align-items:center}
.chatrow input{margin:0;flex:1}
.setn{margin-top:14px;padding:14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.setn h3{margin:0 0 8px;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15);transition:.2s}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--red)}
.sw input:checked+i:before{transform:translateX(20px)}
.toprow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);margin-top:8px;font-size:15px}
.toprow.me{border-color:var(--red);box-shadow:0 0 14px var(--red)}
.toprow b{width:34px;font-size:18px}
.toprow span{flex:1}
.pv{width:100%;max-height:60vh;border-radius:16px;background:#000;margin-top:12px;display:block}
.wait{display:none;margin:12px 0 4px;font-size:13px;color:var(--mute)}
.okc{color:#3ddc84!important}.err{color:#ff7a8a!important}
ol{margin:16px 0 0;padding-left:20px;color:var(--mute);font-size:13px;line-height:1.7}
/* pages */
.page{display:none;animation:in .25s ease}.page.show{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* tiroir */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:linear-gradient(180deg,#140a0e,#08060a);border-right:1px solid var(--line);transform:translateX(-102%);transition:.28s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 14px 20px;overflow-y:auto}
.drawer.show{transform:none}
.brand{padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{font-size:22px;letter-spacing:.16em}.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.2em;margin-top:3px}
.item{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:14px;font-size:15px;margin:2px 0;border:1px solid transparent}
.item span{width:34px;height:34px;border-radius:11px;background:rgba(224,33,58,.14);display:flex;align-items:center;justify-content:center;font-size:17px}
.item.act{background:rgba(224,33,58,.14);border-color:var(--line)}
.sep{font-size:10px;letter-spacing:.3em;color:var(--mute);padding:14px 12px 4px}
/* solde */
.wallet{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(224,33,58,.35),rgba(30,8,14,.8));border-radius:24px;padding:22px;border:1px solid var(--line);margin-top:14px}
.wallet:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,87,.35),transparent 70%)}
.coins{font-size:46px;font-weight:800;color:var(--gold);line-height:1}
.coins small{font-size:14px;color:var(--ink);font-weight:500;margin-left:6px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{background:rgba(0,0,0,.35);border-radius:14px;padding:12px;margin-top:14px;font-size:12px;color:var(--mute)}
.stat b{display:block;font-size:16px;color:var(--ink);margin-top:3px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:.4s}
.cmd{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.cmd:last-child{border:0}.cmd code{color:var(--gold);font-weight:700;white-space:nowrap}.cmd span{color:var(--mute)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:#1b0d12;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;z-index:40;transform:translateY(140%);transition:.3s}
.toast.show{transform:none}
#gift{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
#gift.show{display:flex}
#gift .gc{background:var(--card,#150a0f);border:1px solid var(--line);border-radius:24px;padding:28px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 0 40px rgba(255,200,60,.25)}
#gift .ge{font-size:56px;line-height:1}
#gift h3{margin:12px 0 6px;font-size:21px}
#gift .gn{font-size:34px;font-weight:800;margin:8px 0}
#gift p{margin:0 0 16px;opacity:.85;font-size:14px}

em{font-style:normal}
.langs{display:flex;gap:8px;padding:6px 8px 14px}
.langs button{flex:1;margin:0;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:22px;color:#fff}
.langs button.act{background:rgba(224,33,58,.25);border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.pack{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:10px;background:rgba(0,0,0,.3)}
.pack b{font-size:18px;color:var(--gold)}.pack small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.pack .pr{text-align:right;font-weight:800;font-size:16px}.pack .pr small{font-weight:400}
.pack.hot{border-color:var(--gold)}

.promo{padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#ffd777,#e59a1d);color:#2a1700;font-weight:800;font-size:14px;text-align:center}
.pack s{opacity:.6}
:root[data-theme=dark]{--red:#e0213a;--red2:#8e0f20;--gold:#ffc857;--line:rgba(224,33,58,.4)}
:root[data-theme=violet]{--red:#9b5cff;--red2:#4a1fa8;--gold:#e6b8ff;--line:rgba(155,92,255,.4)}
:root[data-theme=emerald]{--red:#14c98a;--red2:#066b4a;--gold:#d7ff7a;--line:rgba(20,201,138,.4)}
:root[data-theme=gold]{--red:#e8b04a;--red2:#8a5a10;--gold:#fff0b3;--line:rgba(232,176,74,.4)}
:root[data-theme=ocean]{--red:#1c8cff;--red2:#0b3a7a;--gold:#7fe3ff;--line:rgba(28,140,255,.4)}
:root[data-theme=rose]{--red:#ff4d94;--red2:#8a1048;--gold:#ffc2dd;--line:rgba(255,77,148,.4)}
:root[data-theme=light]{--red:#e0213a;--red2:#8e0f20;--gold:#c77a00;--line:rgba(224,33,58,.4)}
:root[data-theme=sakura]{--red:#e0457b;--red2:#a01850;--gold:#c77a00;--line:rgba(224,69,123,.4)}
:root[data-theme=mint]{--red:#12a671;--red2:#0a6e4b;--gold:#b87a00;--line:rgba(18,166,113,.4)}

:root[data-theme=light],:root[data-theme=sakura],:root[data-theme=mint]{--ink:#1d1216;--mute:#6b5a60;--card:rgba(255,255,255,.84)}
:root[data-theme=light],:root[data-theme=sakura],:root[data-theme=mint]{background:#fff5f7}
:root[data-theme=sakura] body{background:linear-gradient(180deg,rgba(255,235,243,.7),rgba(255,226,238,.95)),url(bg.jpg) center top/cover fixed no-repeat}
:root[data-theme=mint] body{background:linear-gradient(180deg,rgba(232,255,246,.7),rgba(220,250,238,.95)),url(bg.jpg) center top/cover fixed no-repeat}
:root[data-theme=light] body{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,245,247,.92)),var(--bgimg) center top/cover fixed no-repeat}
:root[data-theme=light] body,:root[data-theme=sakura] body,:root[data-theme=mint] body{color:var(--ink)}
:root[data-theme=light] input,:root[data-theme=light] select,:root[data-theme=sakura] input,:root[data-theme=sakura] select,:root[data-theme=mint] input,:root[data-theme=mint] select{background:rgba(255,255,255,.92);color:#1d1216}
:root[data-theme=light] .drawer,:root[data-theme=sakura] .drawer,:root[data-theme=mint] .drawer{background:linear-gradient(180deg,#fff,#fdeef3);color:#1d1216}
:root[data-theme=light] .menu i,:root[data-theme=sakura] .menu i,:root[data-theme=mint] .menu i{background:#1d1216}
:root[data-theme=light] .menu,:root[data-theme=sakura] .menu,:root[data-theme=mint] .menu,:root[data-theme=light] .langs button,:root[data-theme=sakura] .langs button,:root[data-theme=mint] .langs button{color:#1d1216}
:root[data-theme=light] .stat,:root[data-theme=sakura] .stat,:root[data-theme=mint] .stat,:root[data-theme=light] .pack,:root[data-theme=sakura] .pack,:root[data-theme=mint] .pack{background:rgba(255,255,255,.75)}
:root[data-theme=light] .toast,:root[data-theme=sakura] .toast,:root[data-theme=mint] .toast{background:#fff;color:#1d1216}
:root[data-theme=light] .coins small,:root[data-theme=light] .stat b,:root[data-theme=sakura] .coins small,:root[data-theme=sakura] .stat b,:root[data-theme=mint] .coins small,:root[data-theme=mint] .stat b{color:#1d1216}
:root[data-theme=light] .wallet,:root[data-theme=sakura] .wallet,:root[data-theme=mint] .wallet{background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,214,224,.7))}
.themes{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding:0 8px 14px}
.themes button{margin:0;padding:0;aspect-ratio:1;border-radius:50%;border:2px solid transparent;font-size:0}
.themes button.act{border-color:#fff;box-shadow:0 0 0 2px var(--red)}
button.ghost{color:var(--ink)}
#status{display:none!important}
.mode{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);margin:0;padding:0;font-size:19px;flex:none;color:inherit}

.brand b{font-family:Orbitron,system-ui,sans-serif;font-size:24px;letter-spacing:.2em;background:linear-gradient(90deg,#fff,var(--red) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.brand small{font-family:Rajdhani,system-ui,sans-serif;font-weight:600;letter-spacing:.22em;word-break:break-all}
.item{font-family:Rajdhani,system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;transition:.2s}
.item em{font-style:normal}
.item span{background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 4px 12px rgba(224,33,58,.35);font-size:18px}
.item.act{background:linear-gradient(90deg,rgba(224,33,58,.28),transparent);border-color:var(--line);box-shadow:inset 3px 0 0 var(--red)}
.item:active{transform:scale(.97)}
.sep{font-family:Orbitron,system-ui,sans-serif;font-size:9px;letter-spacing:.4em;opacity:.7}
.title b{font-family:Orbitron,system-ui,sans-serif;font-weight:800;letter-spacing:.2em;background:linear-gradient(90deg,#fff,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme=light] .title b{background:linear-gradient(90deg,#1d1216,var(--red));-webkit-background-clip:text;background-clip:text}
h2{font-family:Rajdhani,system-ui,sans-serif;font-weight:700;letter-spacing:.03em}
.notice{margin-top:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,200,87,.22),rgba(224,33,58,.18));border:1px solid var(--gold);font-size:14px;line-height:1.5}
.notice b{color:var(--gold)}
/* ===================== STYLE NÉON ===================== */
html[data-style=neon]{--red:#00f0ff;--red2:#7a2cff;--gold:#ff2fd6;--line:rgba(0,240,255,.5);--card:rgba(4,8,24,.78);--ink:#eaf9ff;--mute:#8fb4c8}
html[data-style=neon] body{background:radial-gradient(circle at 15% 0%,rgba(122,44,255,.40),transparent 55%),radial-gradient(circle at 100% 45%,rgba(0,240,255,.18),transparent 50%),linear-gradient(180deg,rgba(3,4,15,.80),rgba(3,4,15,.92)),var(--bgimg) center top/cover fixed no-repeat;color:var(--ink)}
html[data-style=neon] .card,html[data-style=neon] .wallet,html[data-style=neon] .pack,html[data-style=neon] .stat,html[data-style=neon] .notice,html[data-style=neon] .code{border-radius:6px;border:1px solid var(--line);box-shadow:0 0 14px rgba(0,240,255,.22),inset 0 0 18px rgba(122,44,255,.12);backdrop-filter:none}
html[data-style=neon] .wallet{background:linear-gradient(135deg,rgba(122,44,255,.35),rgba(4,8,24,.85))}
html[data-style=neon] .wallet:after{display:none}
html[data-style=neon] .stat{background:rgba(0,0,0,.35)}
html[data-style=neon] .code{border-style:dashed}
html[data-style=neon] input,html[data-style=neon] select{border-radius:4px;border:1px solid var(--line);background:rgba(0,0,0,.6);color:var(--ink)}
html[data-style=neon] input:focus{border-color:#ff2fd6;box-shadow:0 0 10px rgba(255,47,214,.5)}
html[data-style=neon] button.big{border-radius:4px;background:rgba(0,240,255,.06);border:1px solid #00f0ff;color:#00f0ff;text-transform:uppercase;letter-spacing:.14em;font-family:Rajdhani,system-ui,sans-serif;font-weight:700;box-shadow:0 0 12px rgba(0,240,255,.45),inset 0 0 12px rgba(0,240,255,.18)}
html[data-style=neon] button.big:active{background:rgba(0,240,255,.25)}
html[data-style=neon] button.gold{background:rgba(255,47,214,.06);border-color:#ff2fd6;color:#ff2fd6;box-shadow:0 0 12px rgba(255,47,214,.45),inset 0 0 12px rgba(255,47,214,.18)}
html[data-style=neon] button.ghost{background:transparent;border-color:var(--line);color:var(--ink);box-shadow:none}
html[data-style=neon] .eyebrow{color:#ff2fd6;text-shadow:0 0 8px #ff2fd6}
html[data-style=neon] h2{text-shadow:0 0 12px rgba(0,240,255,.55)}
html[data-style=neon] .coins{color:#00f0ff;text-shadow:0 0 14px rgba(0,240,255,.8)}
html[data-style=neon] .title b,html[data-style=neon] .brand b{background:none;color:#00f0ff;-webkit-text-fill-color:#00f0ff;text-shadow:0 0 12px #00f0ff}
html[data-style=neon] .menu,html[data-style=neon] .mode{border-radius:6px;border-color:#00f0ff;background:rgba(4,8,24,.8);box-shadow:0 0 10px rgba(0,240,255,.4);backdrop-filter:none}
html[data-style=neon] .pill{border-radius:6px}
html[data-style=neon] .promo{border-radius:4px;background:rgba(255,47,214,.12);border:1px solid #ff2fd6;color:#ff2fd6;box-shadow:0 0 14px rgba(255,47,214,.5);text-shadow:0 0 8px #ff2fd6}
html[data-style=neon] .notice b{color:#ff2fd6}

async function api(path,opt={}){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),opt.timeout||40000);
  const h={'Content-Type':'application/json','x-api-key':KEY,...(TOKEN()?{'x-token':TOKEN()}:{}),...(opt.headers||{})};
  try{
    const r=await fetch(base()+path,{...opt,headers:h,signal:ctl.signal});
    const j=await r.json().catch(()=>({}));
    if(r.status===404) throw new Error(t('soon'));
    if(r.status===401&&TOKEN()){store.set('tok','');store.set('email','');showAuth()}
    if(!r.ok||j.ok===false){
      const er=new Error(j.error||('Erreur '+r.status));er.code=j.code;
      if(j.code==='need_coins')setTimeout(()=>{if(page!=='earn'&&TOKEN())go('earn')},1800);
      throw er;
    }
    return j;
  }catch(e){
    if(e.name==='AbortError') throw new Error(t('timeout'));
    if(e instanceof TypeError) throw new Error(t('net'));
    throw e;
  }finally{clearTimeout(tm)}
}

/* téléchargeur de vidéos */
function saveItem(it,i,holder){
  const ext=it.kind==='image'?'jpg':it.kind==='audio'?'mp3':'mp4';
  const name='yuki_'+Date.now()+(i?('_'+i):'')+'.'+ext;
  if(!(window.Android&&Android.download)){window.open(it.url,'_blank');return}
  let id='';
  try{id=String(Android.download(it.url,name)||'')}catch(e){toast(e.message);return}
  if(!/^\d+$/.test(id))return;
  if(!holder)return;
  holder.innerHTML='';
  const bar=document.createElement('div');bar.style.cssText='height:8px;border-radius:6px;background:rgba(128,128,128,.25);overflow:hidden;margin-top:10px';
  const fill=document.createElement('div');fill.style.cssText='height:100%;width:3%;background:linear-gradient(90deg,#00f0ff,#e0213a);transition:width .4s';bar.appendChild(fill);
  const st=document.createElement('p');st.style.margin='6px 0 0';st.textContent=t('d_dl');
  const cb=document.createElement('button');cb.className='big';cb.style.cssText='margin-top:8px;padding:11px;font-size:14px';cb.textContent=t('d_cancel');
  holder.append(bar,st,cb);
  let alive=true;
  const stop=(msg,ok)=>{alive=false;clearInterval(iv);cb.remove();st.textContent=msg;if(ok===false)st.classList.add('err');if(ok)fill.style.width='100%'};
  const iv=setInterval(()=>{
    if(!alive)return;
    let p='';try{p=String(Android.progress(id))}catch(e){p='gone'}
    if(p==='done')stop(t('d_done'),true);
    else if(p==='failed')stop(t('d_failed'),false);
    else if(p==='gone')stop(t('d_cancelled'));
    else{fill.style.width=Math.max(3,+p||3)+'%';st.textContent=t('d_dl')+' '+(+p||0)+'%'}
  },600);
  cb.onclick=()=>{try{Android.cancel(id)}catch(e){};stop(t('d_cancelled'))};
}
$('dlgo').onclick=async()=>{
  if(!TOKEN())return toast(t('need'));
  const link=$('dll').value.trim(),m=$('dlmsg'),box=$('dlres');
  box.innerHTML='';m.classList.remove('err');
  if(!/https?:\/\/\S+/i.test(link)){m.textContent=t('d_bad');m.classList.add('err');return}
  $('dlgo').disabled=true;m.textContent=t('d_wait');
  try{
    const j=await api('/api/download',{method:'POST',body:JSON.stringify({url:link}),timeout:90000});
    m.textContent=t('d_ok')+j.coins+(j.title?'\n'+j.title:'');m.style.whiteSpace='pre-line';
    let nv=0;
    j.items.forEach((it,i)=>{
      let pv=null;
      if(it.kind==='video'){pv=document.createElement('video');pv.controls=true;pv.playsInline=true;pv.preload='metadata';pv.className='pv';if(j.thumb)pv.poster=j.thumb;pv.src=it.url;nv++}
      else if(it.kind==='audio'){pv=document.createElement('audio');pv.controls=true;pv.preload='none';pv.className='pv';pv.style.maxHeight='54px';pv.src=it.url}
      else if(it.kind==='image'){pv=document.createElement('img');pv.className='pv';pv.src=it.url}
      if(pv)box.appendChild(pv);
      const b=document.createElement('button');b.className='big '+(it.kind==='audio'?'':'gold');
      b.textContent=it.kind==='audio'?t('d_aud'):it.kind==='image'?t('d_img'):t('d_vid')+(it.hd?t('d_hd'):'');
      const hold=document.createElement('div');b.onclick=()=>saveItem(it,i,hold);box.appendChild(b);box.appendChild(hold);
    });
    loadWallet(true);
  }catch(e){m.textContent=e.message;m.classList.add('err')}
  finally{$('dlgo').disabled=false}
};
